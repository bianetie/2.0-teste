
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5dce9">
<title>Doce Destino</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  font-family: Georgia, serif;
  background: #f8e8f1;
}

/* TELA INICIAL */

#startScreen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: linear-gradient(
    135deg,
    #fff5fa,
    #f7ddeb,
    #ebc7df,
    #fff0f7
  );
  background-size: 300% 300%;
  animation: backgroundMove 16s ease infinite;
}

@keyframes backgroundMove {
  0%, 100% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
}

/* CORAÇÕES FLUTUANTES */

.heart {
  position: absolute;
  bottom: -60px;
  color: #d99abf;
  opacity: 0;
  pointer-events: none;
  animation: floatHeart linear infinite;
}

.heart:nth-child(1) {
  left: 10%;
  font-size: 24px;
  animation-duration: 13s;
}

.heart:nth-child(2) {
  left: 30%;
  font-size: 17px;
  animation-duration: 17s;
  animation-delay: -5s;
}

.heart:nth-child(3) {
  left: 55%;
  font-size: 30px;
  animation-duration: 15s;
  animation-delay: -9s;
}

.heart:nth-child(4) {
  left: 75%;
  font-size: 20px;
  animation-duration: 19s;
  animation-delay: -3s;
}

.heart:nth-child(5) {
  left: 90%;
  font-size: 26px;
  animation-duration: 14s;
  animation-delay: -7s;
}

@keyframes floatHeart {
  0% {
    transform: translateY(0) rotate(-15deg);
    opacity: 0;
  }

  15% {
    opacity: .55;
  }

  85% {
    opacity: .55;
  }

  100% {
    transform: translateY(-115vh) rotate(25deg);
    opacity: 0;
  }
}

/* CONTEÚDO CENTRAL */

.startContent {
  position: relative;
  z-index: 2;
  width: 90%;
  max-width: 430px;
  text-align: center;
  animation: appear 1.4s ease-out;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.symbol {
  font-size: 45px;
  color: #c889ad;
  margin-bottom: 18px;
  animation: heartbeat 3s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.12);
  }
}

/* LOGOTIPO */

.logo {
  font-size: clamp(42px, 10vw, 60px);
  font-weight: normal;
  letter-spacing: 2px;
  color: #815674;
  text-shadow: 0 3px 15px #fff8;
}

.subtitle {
  margin-top: 15px;
  font-size: 14px;
  letter-spacing: 1px;
  color: #a27491;
}

/* BOTÃO */

.startButton {
  margin-top: 55px;
  padding: 16px 35px;
  border-radius: 35px;
  border: 1px solid #d5a7c1;
  background: linear-gradient(
    180deg,
    #ffffff,
    #fcecf5
  );
  color: #815674;
  font-family: Georgia, serif;
  font-size: 15px;
  box-shadow: 0 8px 25px #9f64842b;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}

.startButton:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 30px #9f648444;
}

.startButton:active {
  transform: scale(.96);
}

/* RODAPÉ */

.footer {
  position: absolute;
  bottom: 24px;
  width: 100%;
  text-align: center;
  font-family: Arial, sans-serif;
  font-size: 10px;
  color: #a8849a;
  z-index: 2;
}

/* PRÓXIMA TELA */

#gameScreen {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: #fff3fa;
  color: #815674;
  text-align: center;
  padding: 25px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<div id="startScreen">

  <div class="heart">♡</div>
  <div class="heart">♡</div>
  <div class="heart">♡</div>
  <div class="heart">♡</div>
  <div class="heart">♡</div>

  <div class="startContent">

    <div class="symbol">♡</div>

    <h1 class="logo">Doce Destino</h1>

    <p class="subtitle">
      Seu coração escolhe o caminho.
    </p>

    <button
      class="startButton"
      id="startButton"
    >
      Começar minha história ♡
    </button>

  </div>

  <div class="footer">
    © 2026 Bianca — Doce Destino
  </div>

</div>

<div id="gameScreen">
  <div>
    <h2>O começo de uma nova história ♡</h2>
    <p style="margin-top:15px">
      Em breve, sua aventura começa aqui...
    </p>
  </div>
</div>

<script>
const startButton = document.getElementById("startButton");
const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");

startButton.addEventListener("click", () => {
  startScreen.style.display = "none";
  gameScreen.style.display = "flex";
});
</script>

</body>
</html>
