
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#281c34">

  <title>Doce Destino 2.0</title>

  <style>
    /* =========================================
       DOCE DESTINO 2.0
       TELA INICIAL — RESPONSIVA
    ========================================= */

    :root {
      --pink: #ffb5d3;
      --white: #fff8fc;
      --dark: #281c34;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--dark);
      color: var(--white);
      font-family: Georgia, serif;
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================
       CENÁRIO
    ========================================= */

    .screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
    }

    .background {
      position: absolute;
      inset: 0;

      background-image: url("./tela-inicial.png");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;

      animation: cameraMove 24s ease-in-out infinite alternate;
      z-index: -2;
    }

    @keyframes cameraMove {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.045);
      }
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;

      background: linear-gradient(
        to bottom,
        rgba(25, 12, 30, 0.28),
        transparent 30%,
        transparent 52%,
        rgba(25, 12, 30, 0.65)
      );
    }

    /* =========================================
       MENU
    ========================================= */

    .menu {
      position: absolute;
      top: max(22px, env(safe-area-inset-top));
      left: 22px;

      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 5;
    }

    .menu button {
      padding: 11px 16px;
      border: 1px solid #ffffff55;
      border-radius: 14px;

      background: #281c3488;
      backdrop-filter: blur(12px);

      color: white;
      text-align: left;
      font-size: 14px;

      transition: background 0.2s, transform 0.2s;
    }

    .menu button:hover {
      background: #b45b8baa;
      transform: translateX(3px);
    }

    /* =========================================
       BOTÃO PRINCIPAL
    ========================================= */

    .bottomArea {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(28px, env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;

      padding: 0 20px;
      z-index: 5;
    }

    .startButton {
      width: min(420px, 90vw);
      min-height: 58px;

      border: 2px solid #ffe1ef;
      border-radius: 40px;

      background: linear-gradient(
        180deg,
        #fbb3d1,
        #d96b9f
      );

      box-shadow:
        0 0 25px #ff9bc988,
        0 8px 24px #281c3488;

      color: white;
      font-size: clamp(15px, 3.5vw, 21px);
      text-shadow: 0 2px 4px #713452;

      transition: transform 0.2s;
    }

    .startButton:active {
      transform: scale(0.97);
    }

    .copyright {
      font-family: Arial, sans-serif;
      font-size: 10px;
      color: #fff9;
    }

    /* =========================================
       JANELAS
    ========================================= */

    .overlay {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;
      background: #1d1026c9;
      backdrop-filter: blur(12px);

      z-index: 20;
    }

    .overlay.open {
      display: flex;
    }

    .panel {
      width: min(440px, 100%);
      padding: 30px 24px;

      background: #fff5fb;
      color: #754565;

      border: 2px solid #ffd5e8;
      border-radius: 24px;

      text-align: center;
      box-shadow: 0 20px 60px #0007;
    }

    .panel h2 {
      margin-top: 0;
    }

    .panel p {
      line-height: 1.6;
    }

    .panel button {
      padding: 12px 25px;
      border: 0;
      border-radius: 25px;
      background: #df89b1;
      color: white;
    }

    /* =========================================
       CELULAR
    ========================================= */

    @media (max-width: 600px) {
      .background {
        background-position: 49% center;
      }

      .menu {
        top: max(12px, env(safe-area-inset-top));
        left: 10px;
        right: 10px;

        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
      }

      .menu button {
        padding: 9px 11px;
        font-size: 11px;
        border-radius: 12px;
      }

      .bottomArea {
        bottom: max(20px, env(safe-area-inset-bottom));
      }

      .startButton {
        min-height: 55px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .background {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="screen">

    <div class="background"></div>

    <nav class="menu" aria-label="Menu principal">

      <button type="button" onclick="openPanel('Configurações', 'Em breve teremos ajustes de som e imagem.')">
        ⚙ Configurações
      </button>

      <button type="button" onclick="openPanel('Galeria', 'Aqui aparecerão as ilustrações desbloqueadas.')">
        ♡ Galeria
      </button>

      <button type="button" onclick="openPanel('História', 'Os capítulos serão adicionados em breve.')">
        ☆ História
      </button>

      <button type="button" onclick="saveGame()">
        ♡ Salvar
      </button>

      <button type="button" onclick="loadGame()">
        ↗ Carregar
      </button>

      <button type="button" onclick="toggleMusic()">
        ♫ Música
      </button>

    </nav>

    <div class="bottomArea">

      <button
        type="button"
        class="startButton"
        onclick="startGame()"
      >
        Começar minha história ♡
      </button>

      <div class="copyright">
        © 2026 Bianca — Doce Destino
      </div>

    </div>

  </main>

  <div
    id="overlay"
    class="overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >

    <div class="panel">

      <h2 id="modalTitle"></h2>

      <p id="modalText"></p>

      <button type="button" onclick="closePanel()">
        Voltar ♡
      </button>

    </div>

  </div>

  <script>
    "use strict";

    const overlay = document.getElementById("overlay");
    const modalTitle = document.getElementById("modalTitle");
    const modalText = document.getElementById("modalText");

    let musicEnabled = true;

    function openPanel(title, message) {
      modalTitle.textContent = title;
      modalText.textContent = message;

      overlay.classList.add("open");
    }

    function closePanel() {
      overlay.classList.remove("open");
    }

    function startGame() {
      localStorage.setItem("doceDestinoStarted", "true");

      openPanel(
        "Sua história começa aqui ♡",
        "A tela inicial está pronta! A primeira cena será nossa próxima etapa."
      );
    }

    function saveGame() {
      const saveData = {
        started: localStorage.getItem("doceDestinoStarted") === "true"
      };

      localStorage.setItem(
        "doceDestinoSaved",
        JSON.stringify(saveData)
      );

      openPanel(
        "Jogo salvo ♡",
        "O estado inicial foi salvo neste navegador."
      );
    }

    function loadGame() {
      const saved = localStorage.getItem("doceDestinoSaved");

      openPanel(
        "Carregar",
        saved
          ? "Seu estado inicial foi encontrado."
          : "Nenhum jogo salvo foi encontrado."
      );
    }

    function toggleMusic() {
      musicEnabled = !musicEnabled;

      openPanel(
        "Música",
        musicEnabled
          ? "Música ativada. A trilha sonora será adicionada depois."
          : "Música desativada."
      );
    }

    overlay.addEventListener("click", function(event) {
      if (event.target === overlay) {
        closePanel();
      }
    });

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closePanel();
      }
    });
  </script>

</body>
</html>
