<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#42253d">
<title>Doce Destino 2.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#281c34;font-family:Georgia,serif}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.screen{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}.art{position:relative;width:min(100vw,177.77778dvh);aspect-ratio:3/2;background:#3d2841 url('tela-inicial.png') center/100% 100% no-repeat;box-shadow:0 0 90px #0006}
/* The visible title and menu artwork are part of the image; these transparent hit areas make them interactive. */
.hotspot{position:absolute;display:block;border:0;background:transparent;color:transparent;border-radius:18px;touch-action:manipulation}.hotspot:focus-visible{outline:3px solid #fff;outline-offset:2px;background:#ffb3dc33}
#play{left:34%;top:76%;width:32%;height:11%}
#settings{left:3%;top:2%;width:18%;height:7%}#gallery{left:3%;top:8%;width:16%;height:7%}#history{left:3%;top:14%;width:16%;height:7%}
#save{right:1%;top:5%;width:11%;height:9%}#load{right:1%;top:14%;width:11%;height:9%}#music{right:1%;top:23%;width:11%;height:9%}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#201426b8;backdrop-filter:blur(8px);z-index:5}
#overlay.open{display:flex}.panel{width:min(440px,94vw);padding:30px 24px;border:2px solid #ffe1f0;border-radius:24px;background:linear-gradient(145deg,#fff8fc,#f5d7e9);box-shadow:0 20px 70px #0007;text-align:center;color:#734362}.panel h2{margin:0 0 12px;font-size:26px}.panel p{line-height:1.6}.panel button{margin:10px 5px 0;padding:12px 22px;border:1px solid #d38eaf;border-radius:30px;background:#eaa6c8;color:#54253e;font-weight:bold}
@media(max-aspect-ratio:3/2){.art{width:100vw;height:66.6667vw}}
@media(min-aspect-ratio:3/2){.art{height:100dvh;width:150dvh}}
</style>
</head>
<body>
<main class="screen" aria-label="Tela inicial do Doce Destino">
 <div class="art">
  <button id="settings" class="hotspot" aria-label="Configurações" onclick="show('Configurações','Ajustes do jogo serão adicionados aqui.')"></button>
  <button id="gallery" class="hotspot" aria-label="Galeria" onclick="show('Galeria','As ilustrações desbloqueadas aparecerão aqui.')"></button>
  <button id="history" class="hotspot" aria-label="História" onclick="show('História','A história será construída nos próximos capítulos.')"></button>
  <button id="save" class="hotspot" aria-label="Salvar" onclick="save()"></button>
  <button id="load" class="hotspot" aria-label="Carregar" onclick="load()"></button>
  <button id="music" class="hotspot" aria-label="Música" onclick="toggleMusic()"></button>
  <button id="play" class="hotspot" aria-label="Começar minha história" onclick="start()"></button>
 </div>
</main>
<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
 <div class="panel"><h2 id="modalTitle"></h2><p id="modalText"></p><button onclick="closePanel()">Voltar ♡</button></div>
</div>
<script>
let musicEnabled=true;
function show(title,message){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=message;document.getElementById('overlay').classList.add('open')}
function closePanel(){document.getElementById('overlay').classList.remove('open')}
function start(){localStorage.setItem('doceDestinoStarted','true');show('Sua história começa aqui ♡','A tela inicial está pronta! Agora vamos construir a primeira cena do jogo.')}
function save(){localStorage.setItem('doceDestinoSaved',JSON.stringify({started:localStorage.getItem('doceDestinoStarted')==='true'}));show('Jogo salvo ♡','Seu progresso inicial foi salvo neste navegador.')}
function load(){const data=localStorage.getItem('doceDestinoSaved');show('Carregar',data?'Progresso inicial encontrado! A continuação da história será adicionada em breve.':'Você ainda não tem nenhum jogo salvo neste navegador.')}
function toggleMusic(){musicEnabled=!musicEnabled;show('Música',musicEnabled?'Música ativada. Vamos adicionar a trilha sonora depois.':'Música desativada.')}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closePanel()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
</script>
</body>
</html>
